name: I.A Next archive to signed APK
on:
  push:
    branches: [ia-phone-host-next]
    paths:
      - IA-Next-Android-Codebase.zip
      - .github/workflows/ia-next-archive-build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ia-next-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'triplxinx/image-anarquee-android' && github.ref == 'refs/heads/ia-phone-host-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          import pathlib, zipfile, stat, shutil
          root = pathlib.Path('phone-host-next')
          if root.exists() or root.is_symlink():
              raise SystemExit('phone-host-next already exists; remove it or choose a clean checkout')
          with zipfile.ZipFile('IA-Next-Android-Codebase.zip') as z:
              seen = set()
              for entry in z.infolist():
                  name = pathlib.PurePosixPath(entry.filename)
                  if name.is_absolute() or '..' in name.parts or '\\' in entry.filename or stat.S_ISLNK(entry.external_attr >> 16) or entry.filename in seen:
                      raise SystemExit('Unsafe or duplicate archive entry: ' + entry.filename)
                  if not name.parts or name.parts[0] not in ('android', 'dist', 'README.md'):
                      raise SystemExit('Unexpected archive entry: ' + entry.filename)
                  seen.add(entry.filename)
              if sum(i.file_size for i in z.infolist()) > 200_000_000:
                  raise SystemExit('Archive exceeds extraction limit')
              z.extractall(root)
          for f in ('android/build.sh','android/AndroidManifest.xml','dist/index.html'):
              if not (root / f).is_file(): raise SystemExit('Missing ' + f)
          PYEXTRACT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK using runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Compile and sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.IA_NEXT_KEYSTORE_B64 }}
          ARCHIVE_KEY_PASSWORD: ${{ secrets.IA_NEXT_KEY_PASSWORD }}
          ARCHIVE_APPLICATION_ID: studio.ellis.archivedesk.next
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing IA_NEXT_KEYSTORE_B64 secret}"
          : "${ARCHIVE_KEY_PASSWORD:?Missing IA_NEXT_KEY_PASSWORD secret}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ARCHIVE_KEYSTORE="$RUNNER_TEMP/ia-next.p12"
          umask 077
          trap 'rm -f "$ARCHIVE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ARCHIVE_KEYSTORE"
          bash phone-host-next/android/build.sh "$GITHUB_WORKSPACE/iMAG3-Next.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose iMAG3-Next.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging iMAG3-Next.apk | grep -F "package: name='studio.ellis.archivedesk.next'"
      - uses: actions/upload-artifact@v4
        with:
          name: iMAG3-Next
          path: iMAG3-Next.apk
          if-no-files-found: error
